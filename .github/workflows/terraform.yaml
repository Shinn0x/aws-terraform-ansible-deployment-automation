name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "bootstrap/02-github-oidc/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "bootstrap/02-github-oidc/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The IAM role only trusts the main branch. Pull requests and runs on
      # other branches send a different OIDC sub claim and would be denied,
      # so the AWS steps only run on main.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: GitHubActionsTerraform

      - name: Verify AWS identity
        if: github.ref == 'refs/heads/main'
        run: |
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "Caller identity: $ARN"
          case "$ARN" in
            *":assumed-role/github-actions-terraform-role/"*)
              echo "OIDC role assumed successfully." ;;
            *)
              echo "::error::Expected github-actions-terraform-role, got: $ARN"
              exit 1 ;;
          esac

      - name: Verify state bucket access
        if: github.ref == 'refs/heads/main'
        run: |
          aws s3 ls "s3://shinn-terraform-state-foundation" > /dev/null
          echo "State bucket is reachable with the role's permissions."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (OIDC bootstrap)
        working-directory: bootstrap/02-github-oidc
        run: terraform init -backend=false

      - name: Terraform Validate (OIDC bootstrap)
        working-directory: bootstrap/02-github-oidc
        run: terraform validate

      - name: Terraform Init (dev environment)
        working-directory: infrastructure/environments/dev
        run: terraform init -backend=false

      - name: Terraform Validate (dev environment)
        working-directory: infrastructure/environments/dev
        run: terraform validate
