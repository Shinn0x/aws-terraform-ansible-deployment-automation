name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "bootstrap/02-github-oidc/**"
      - ".github/workflows/terraform.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "bootstrap/02-github-oidc/**"
      - ".github/workflows/terraform.yaml"

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # No AWS access needed
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          for dir in bootstrap/02-github-oidc infrastructure/environments/dev infrastructure/environments/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # Push to main deploys dev. A manual run on main can deploy dev or prod.
  deploy:
    name: Plan and apply ${{ inputs.environment || 'dev' }}
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-apply-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false

    env:
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

    defaults:
      run:
        working-directory: infrastructure/environments/${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: |
          if [ -z "$TF_VAR_aws_account_id" ]; then
            echo "::error::The AWS_ACCOUNT_ID repository secret is not set."
            exit 1
          fi

          read -r ACCOUNT ARN < <(aws sts get-caller-identity --query '[Account, Arn]' --output text)

          if [ "$ACCOUNT" != "$TF_VAR_aws_account_id" ]; then
            echo "::error::The credentials are for a different AWS account than the AWS_ACCOUNT_ID secret."
            exit 1
          fi

          case "$ARN" in
            *":assumed-role/github-actions-terraform-role/"*)
              echo "OIDC role assumed in the expected account." ;;
            *)
              echo "::error::Expected github-actions-terraform-role, got a different identity."
              exit 1 ;;
          esac

      - name: Verify state bucket access
        run: aws s3 ls "s3://shinn-terraform-state-foundation" > /dev/null

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      # Apply the saved plan
      - name: Terraform apply
        run: terraform apply tfplan
