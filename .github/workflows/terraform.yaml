name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "bootstrap/02-github-oidc/**"
      - ".github/workflows/terraform.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "bootstrap/02-github-oidc/**"
      - ".github/workflows/terraform.yaml"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # Runs on every event. Needs no AWS access.
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Validate OIDC bootstrap
        working-directory: bootstrap/02-github-oidc
        run: |
          terraform init -backend=false
          terraform validate

      # Also validates the modules
      - name: Validate dev environment
        working-directory: infrastructure/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate prod environment
        working-directory: infrastructure/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

  # Plans and applies dev. Only on main: the IAM role trusts the main
  # branch only, so pull requests and other branches would be denied.
  deploy:
    name: Plan and apply dev
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    # Queue applies one after another instead of running them in parallel
    concurrency:
      group: terraform-apply-dev
      cancel-in-progress: false

    env:
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

    defaults:
      run:
        working-directory: infrastructure/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: |
          if [ -z "$TF_VAR_aws_account_id" ]; then
            echo "::error::The AWS_ACCOUNT_ID repository secret is not set."
            exit 1
          fi

          read -r ACCOUNT ARN < <(aws sts get-caller-identity --query '[Account, Arn]' --output text)

          if [ "$ACCOUNT" != "$TF_VAR_aws_account_id" ]; then
            echo "::error::The credentials are for a different AWS account than the AWS_ACCOUNT_ID secret."
            exit 1
          fi

          case "$ARN" in
            *":assumed-role/github-actions-terraform-role/"*)
              echo "OIDC role assumed in the expected account." ;;
            *)
              echo "::error::Expected github-actions-terraform-role, got a different identity."
              exit 1 ;;
          esac

      - name: Verify state bucket access
        run: |
          aws s3 ls "s3://shinn-terraform-state-foundation" > /dev/null
          echo "State bucket is reachable with the role's permissions."

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      # Applies exactly the plan above, not a fresh one
      - name: Terraform apply
        run: terraform apply tfplan
