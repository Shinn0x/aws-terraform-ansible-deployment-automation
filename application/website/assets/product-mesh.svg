<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Agex Mesh doodle: hexagon network tiles linked together, the main tile with the Agex logo. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="51" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="60" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <path d="M0 0V7" stroke="#1a1a1a" stroke-width="1.3" opacity=".5"/>
    </pattern>
  </defs>
  <g filter="url(#rough)"><path d="M196 150L86 212" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="1 8"/><path d="M196 150L318 92" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="1 8"/><path d="M196 150L318 220" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="1 8"/></g>
