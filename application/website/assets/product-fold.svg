<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Agex Fold doodle: a full screen unrolled from a pen-sized tube, with the Agex logo on screen. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="50" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <path d="M0 0V7" stroke="#1a1a1a" stroke-width="1.3" opacity=".5"/>
    </pattern>
  </defs>
  <g filter="url(#rough)"><path d="M92 234Q211 240 330 232" stroke="#1a1a1a" stroke-width="3"/><path d="M142 246H201M225 245H251" stroke="#1a1a1a" stroke-width="2.5"/></g>
  <g filter="url(#rough)"><path d="M136 84H312V204H136Z" fill="#ffb08a" transform="translate(-7 7)"/><path d="M136 84H312V204H136Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g transform="translate(176 122) scale(1.375)"><rect width="32" height="32" rx="8" fill="#1a1a1a"/><path d="M10 23 16 9l6 14" stroke="#fff" stroke-width="3"/><path d="M12.4 18h7.2" stroke="#ff5f1f" stroke-width="3"/></g><path d="M240 118H292" stroke="#1a1a1a" stroke-width="3"/><path d="M240 140H292" stroke="#1a1a1a" stroke-width="3"/><path d="M240 162H268" stroke="#ff5f1f" stroke-width="3"/><path d="M122 70a14 14 0 0 1 28 0V218a14 14 0 0 1-28 0Z" fill="#ff5f1f" stroke="#1a1a1a" stroke-width="3"/><path d="M122 92H150" stroke="#1a1a1a" stroke-width="2.5"/></g>
  <g filter="url(#rough)"><path d="M344 63V77M337 70H351M341.1 67.1L346.9 72.9M346.9 67.1L341.1 72.9" stroke="#ff5f1f" stroke-width="2.5"/></g>
