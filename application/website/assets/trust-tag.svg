<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Trust doodle: a price tag with the Agex logo, next to an open padlock (no lock-in). -->
